<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Games Foryou</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet" />
</head>
<body>
    <div class="bg-effects"></div>

    <header>
        <div class="header-inner">
            <div class="logo">
                <span class="logo-icon">&#9733;</span>
                <h1>Games Foryou</h1>
            </div>
            <p class="tagline">Classic Arcade Collection</p>
        </div>
    </header>

    <main>
        <div class="hero">
            <h2>Choose Your Game</h2>
            <p>Rediscover timeless classics reimagined for modern play.</p>
        </div>

        <div class="game-grid" id="gameGrid">
            <a href="#bounce" class="game-card" data-game="bounce" style="--accent:#ff6b6b;">
                <div class="card-bg"></div>
                <div class="card-icon">
                    <svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="14" fill="none" stroke="currentColor" stroke-width="3"/><rect x="8" y="44" width="48" height="6" rx="3" fill="currentColor"/></svg>
                </div>
                <div class="card-content">
                    <h3>Bounce</h3>
                    <span class="card-count">1</span>
                </div>
                <div class="card-glow"></div>
            </a>
            <a href="#snake" class="game-card" data-game="snake" style="--accent:#51cf66;">
                <div class="card-bg"></div>
                <div class="card-icon">
                    <svg viewBox="0 0 64 64"><path d="M16 32 Q32 16 48 32 Q56 40 48 48 Q40 56 32 48 Q24 40 16 32Z" fill="none" stroke="currentColor" stroke-width="3"/></svg>
                </div>
                <div class="card-content">
                    <h3>Snake</h3>
                    <span class="card-count">2</span>
                </div>
                <div class="card-glow"></div>
            </a>
            <a href="#tetris" class="game-card" data-game="tetris" style="--accent:#4dabf7;">
                <div class="card-bg"></div>
                <div class="card-icon">
                    <svg viewBox="0 0 64 64"><rect x="12" y="12" width="12" height="12" fill="currentColor" opacity="0.7"/><rect x="26" y="12" width="12" height="12" fill="currentColor"/><rect x="40" y="12" width="12" height="12" fill="currentColor" opacity="0.7"/><rect x="26" y="26" width="12" height="12" fill="currentColor"/><rect x="26" y="40" width="12" height="12" fill="currentColor" opacity="0.7"/></svg>
                </div>
                <div class="card-content">
                    <h3>Tetris</h3>
                    <span class="card-count">3</span>
                </div>
                <div class="card-glow"></div>
            </a>
            <a href="#defender" class="game-card" data-game="defender" style="--accent:#fcc419;">
                <div class="card-bg"></div>
                <div class="card-icon">
                    <svg viewBox="0 0 64 64"><rect x="10" y="28" width="44" height="8" rx="2" fill="currentColor"/><rect x="22" y="12" width="4" height="16" fill="currentColor"/><rect x="38" y="12" width="4" height="16" fill="currentColor"/><circle cx="20" cy="32" r="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="44" cy="32" r="4" fill="none" stroke="currentColor" stroke-width="2"/></svg>
                </div>
                <div class="card-content">
                    <h3>Defender</h3>
                    <span class="card-count">4</span>
                </div>
                <div class="card-glow"></div>
            </a>
            <a href="#pacman" class="game-card" data-game="pacman" style="--accent:#ffd43b;">
                <div class="card-bg"></div>
                <div class="card-icon">
                    <svg viewBox="0 0 64 64"><path d="M32 12 A20 20 0 1 1 32 52 L32 32 L48 20 A20 20 0 0 0 32 12Z" fill="currentColor"/><circle cx="44" cy="24" r="2" fill="#000"/></svg>
                </div>
                <div class="card-content">
                    <h3>Pacman</h3>
                    <span class="card-count">5</span>
                </div>
                <div class="card-glow"></div>
            </a>
            <a href="#puzzle" class="game-card" data-game="puzzle" style="--accent:#da77f2;">
                <div class="card-bg"></div>
                <div class="card-icon">
                    <svg viewBox="0 0 64 64"><rect x="16" y="16" width="14" height="14" rx="2" fill="currentColor"/><rect x="34" y="16" width="14" height="14" rx="2" fill="currentColor" opacity="0.7"/><rect x="16" y="34" width="14" height="14" rx="2" fill="currentColor" opacity="0.7"/><rect x="34" y="34" width="14" height="14" rx="2" fill="currentColor"/></svg>
                </div>
                <div class="card-content">
                    <h3>Puzzle</h3>
                    <span class="card-count">6</span>
                </div>
                <div class="card-glow"></div>
            </a>
            <a href="#spider" class="game-card" data-game="spider" style="--accent:#20c997;">
                <div class="card-bg"></div>
                <div class="card-icon">
                    <svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="6" fill="currentColor"/><path d="M32 38 L32 56 M32 26 L32 8 M38 32 L56 32 M26 32 L8 32 M36 28 L48 16 M28 36 L16 48 M36 36 L48 48 M28 28 L16 16" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
                </div>
                <div class="card-content">
                    <h3>Spider</h3>
                    <span class="card-count">7</span>
                </div>
                <div class="card-glow"></div>
            </a>
        </div>

        <div class="game-frame-container" id="gameFrameContainer">
            <div class="frame-header">
                <span class="frame-title" id="gameTitle">Bounce</span>
                <button class="close-frame" id="closeFrame">&times;</button>
            </div>
            <iframe id="machine" title="Game Frame"></iframe>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Designed and Developed by <a href="https://github.com/ukk1019-yhat" target="_blank" rel="noopener">Umakrishnakanth</a></p>
    </footer>

    <script>
        function play(game) {
            const container = document.getElementById("gameFrameContainer");
            const iframe = document.getElementById("machine");
            const title = document.getElementById("gameTitle");
            const cards = document.querySelectorAll(".game-card");
            const hero = document.querySelector(".hero");

            cards.forEach(c => c.classList.remove("active"));
            const activeCard = document.querySelector(`.game-card[data-game="${game}"]`);
            if (activeCard) activeCard.classList.add("active");

            title.textContent = game.charAt(0).toUpperCase() + game.slice(1);
            iframe.src = game + "/index.html";
            container.classList.add("open");
            hero.style.display = "none";
            document.title = "Games Foryou - " + game.charAt(0).toUpperCase() + game.slice(1);
        }

        function closeGame() {
            const container = document.getElementById("gameFrameContainer");
            const hero = document.querySelector(".hero");
            const cards = document.querySelectorAll(".game-card");
            container.classList.remove("open");
            hero.style.display = "";
            cards.forEach(c => c.classList.remove("active"));
            document.getElementById("gameTitle").textContent = "";
            document.getElementById("machine").src = "";
            document.title = "Games Foryou";
        }

        window.addEventListener("load", () => {
            const hash = location.hash.substring(1);
            if (hash) {
                play(hash);
            }

            document.getElementById("gameGrid").addEventListener("click", (e) => {
                const card = e.target.closest(".game-card");
                if (card && card.dataset.game) {
                    e.preventDefault();
                    play(card.dataset.game);
                    history.pushState(null, "", "#" + card.dataset.game);
                }
            });

            document.getElementById("closeFrame").addEventListener("click", closeGame);

            window.addEventListener("popstate", () => {
                const hash = location.hash.substring(1);
                if (hash) {
                    play(hash);
                } else {
                    closeGame();
                }
            });
        });
    </script>
</body>
</html>
